:root{
  --negro:#000; --blanco:#fff; --gris-dorso:#a6a6a6; --gris:#6b6b6b; --gris-claro:#b4b4b4; --linea:#d9d9d9; --suave:#f4f4f4;
  --f: "Inter Metaxu", Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--blanco);color:var(--negro);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--negro);outline-offset:3px}

.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--linea)}
.barra__int{max-width:38rem;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px;padding:4px 0}
.marca svg{height:20px;width:auto}
.marca b{font-weight:600}
.pasos{font-size:.85rem;color:var(--gris-claro);letter-spacing:.02em}
.pasos b{color:var(--negro);font-weight:600}

main{max-width:38rem;margin:0 auto;padding:28px 20px 90px}
main:focus{outline:none}
h1{font-weight:300;font-size:2.1rem;line-height:1.15;margin:.2em 0 .6em;letter-spacing:-.01em;text-align:center}
.titulo-inicio{letter-spacing:.12em}
.paso{display:flex;align-items:baseline;margin:.55em 0}
.paso__n{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--negro);color:var(--blanco);font-weight:600;font-size:.82em;margin-right:.7em;flex:0 0 auto}
.paso-acl{padding-left:1.6em}
.titulo-inicio span{display:block;margin-top:.15em;font-size:1.15rem;font-style:italic;font-weight:400;letter-spacing:0;color:var(--gris)}
h2{font-weight:300;font-size:1.7rem;line-height:1.2;margin:1.6em 0 .6em;text-align:center}
h3{font-weight:600;font-size:1.05rem;margin:1.8em 0 .5em;text-align:center}
p{margin:0 0 .8em}
p,li,.banda,.texto{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
ul{padding-left:1.2em;margin:.3em 0 1em}
li{margin:.4em 0}
.centro{text-align:center}
.nota{font-style:italic;color:var(--gris)}
.gris{color:var(--gris)}
.chico{font-size:.88rem}
.seccion{margin-top:2.4em}
.seccion:first-child{margin-top:0}
.separador{border:0;border-top:1px solid var(--linea);margin:2.6em 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:46px;padding:.65em 1.25em;border-radius:4px;border:1px solid var(--negro);background:var(--negro);color:var(--blanco);font-weight:500;cursor:pointer;text-decoration:none}
.btn--sec{background:var(--negro);color:var(--blanco)}
.btn--borde{background:var(--blanco);color:var(--negro)}
.btn[disabled]{opacity:.35;cursor:not-allowed}

<script>
/* MUSICA: inicio */
/* Música de Metaxu: kósmos.
   Pieza generativa propia: no hay archivo de audio, la app la sintetiza mientras suena.
   Un mismo tema (re menor, 84 por minuto) armado en capas: colchón de acordes, bajo,
   arpegios, melodía, campanas y aire. Cada ciclo de ocho compases las capas entran,
   se superponen o salen al azar; los arpegios y los motivos de la melodía se eligen
   y se combinan de un repertorio fijo, así que nunca suena dos veces igual.
   Vive acá, entre las marcas MUSICA. La herramienta musica_muestra.py la extrae para grabar muestras.
   Uso:  const m = MetaxuMusica.crear(ctx, ctx.destination, {semilla});
         m.iniciar(); m.volumen(0.5); m.detener();                                  */
(function (G) {
  "use strict";

  function azar(semilla) {
    let s = (semilla >>> 0) || 0x9e3779b9;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* Armonía. b: bajo; p: voces del colchón; t: notas para arpegios y melodía. */
  const ACORDES = {
    Dm9:    { b: 38, p: [50, 53, 57, 60, 64], t: [62, 65, 69, 72, 74, 76] },
    Bbmaj9: { b: 46, p: [50, 53, 57, 60, 65], t: [62, 65, 69, 70, 74, 77] },
    Gm9:    { b: 43, p: [50, 53, 57, 58, 62], t: [62, 65, 67, 70, 74, 77] },
    Asus:   { b: 45, p: [50, 52, 55, 57, 64], t: [62, 64, 67, 69, 74, 76] },
    A7:     { b: 45, p: [49, 52, 55, 57, 64], t: [61, 64, 67, 69, 73, 76] },
    Fmaj7:  { b: 41, p: [48, 52, 53, 57, 60], t: [60, 64, 65, 69, 72, 76] },
  };
  /* Dos recorridos de ocho compases (un acorde cada dos compases). */
  const RECORRIDOS = [
    ["Dm9", "Dm9", "Bbmaj9", "Bbmaj9", "Gm9", "Gm9", "Asus", "A7"],
    ["Bbmaj9", "Bbmaj9", "Fmaj7", "Fmaj7", "Gm9", "Gm9", "Dm9", "Asus"],
  ];
  /* Arpegios: índices sobre t (6 = octava arriba); null es silencio. Ocho corcheas. */
  const ARPEGIOS = [
    [0, 2, 4, 2, 1, 3, 5, 3],
    [0, 1, 2, 3, 4, 5, 4, 3],
    [0, null, 2, null, 4, null, 3, null],
    [5, 4, 2, 4, 3, 1, 2, 0],
    [0, 2, 4, 6, 4, 2, 1, 3],
    [2, 0, 3, 1, 4, 2, 5, 3],
  ];
  /* Motivos de la melodía: [índice sobre t, duración en tiempos]. Cada uno ocupa un compás. */
  const MOTIVOS = [
    [[4, 1], [3, 0.5], [2, 0.5], [1, 2]],
    [[2, 1.5], [3, 0.5], [4, 2]],
    [[5, 3], [4, 1]],
    [[1, 0.5], [2, 0.5], [4, 1], [3, 2]],
    [[4, 2], [5, 1], [4, 1]],
    [[2, 4]],
    [[3, 1], [2, 1], [1, 1], [0, 1]],
  ];

  const BPM = 84, TIEMPO = 60 / BPM, COMPAS = TIEMPO * 4, CICLO = COMPAS * 8;

  function crear(ctx, destino, op) {
    op = op || {};
    const r = azar(op.semilla == null ? (Date.now() & 0xffffffff) : op.semilla);
    const elegir = (a) => a[Math.floor(r() * a.length)];

    /* ---- cadena de salida */
    const mezcla = ctx.createGain(); mezcla.gain.value = 0.9;

function segTxt(v){return{t:"txt",v:v||""}}
function faseNueva(tipo){return{tipo,carta:null,seg:[segTxt()]}}
function nuevoEstado(){return{v:3,instructivo:false,retazos:[],curso:null}}
function faseMigrada(F){const f={tipo:F.tipo,carta:F.carta==null?null:F.carta,seg:[]};
  (F.bloques||[]).forEach(b=>{if(b.ora!=null){f.seg.push({t:"con",ora:b.ora,pregunta:(b.pregunta||"").trim()});f.seg.push(segTxt(b.desc))}});
  if(!f.seg.length)f.seg=[segTxt()];
  if(f.seg[f.seg.length-1].t!=="txt")f.seg.push(segTxt());
  return f}
function migrar(d){
  if(!d||!Array.isArray(d.retazos))return nuevoEstado();
  if(d.v===3)return d;
  return {v:3,instructivo:!!(d.retazos.length||d.curso),
    retazos:d.retazos.map(r=>({n:r.n,nombre:r.nombre||"",inicio:r.inicio,fin:r.fin,fases:r.fases.map(faseMigrada)})),
    curso:d.curso?{n:d.curso.n,fase:d.curso.fase||0,inicio:d.curso.inicio,nombre:d.curso.nombre||"",consulta:null,fases:d.curso.fases.map(faseMigrada)}:null}}
let E, puedeGuardar=true, _migrado=false;
try{const _d=JSON.parse(localStorage.getItem(CLAVE));E=migrar(_d);_migrado=!!(_d&&_d.v!==3)}catch(e){E=nuevoEstado()}
try{localStorage.setItem(CLAVE+".prueba","1");localStorage.removeItem(CLAVE+".prueba")}catch(e){puedeGuardar=false}
if(_migrado)guardar();
let tGuardado,tEscr;
function guardar(mostrarAviso){
  try{localStorage.setItem(CLAVE,JSON.stringify(E))}catch(e){puedeGuardar=false}
  if(mostrarAviso){const g=document.getElementById("guardado");g.classList.add("si");clearTimeout(tGuardado);tGuardado=setTimeout(()=>g.classList.remove("si"),1100)}}
function guardarYa(){clearTimeout(tEscr);guardar()}
function azar(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fecha(iso){return new Date(iso).toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"})}
function campoMin(c){return c.charAt(0)+c.slice(1).toLowerCase()}
const ORD=["Primer","Segundo","Tercer","Cuarto","Quinto","Sexto","Séptimo","Octavo","Noveno","Décimo"];
function nombreRetazo(n){return n<=10?`${ORD[n-1]} retazo`:`Retazo ${n}`}
function titulo(r){return (r.nombre||"").trim()||nombreRetazo(r.n)}
function hayProgreso(){return E.retazos.length>0||!!E.curso}
function esCelular(){return Math.min(screen.width,screen.height)<600}

/* ---------- cartas ---------- */
function svg(k,wmm,hmm){const o=SIMB[k];const st=wmm?` style="width:${(wmm/63*100).toFixed(2)}cqw;height:${(hmm/63*100).toFixed(2)}cqw"`:"";
  return `<svg viewBox="${o.vb}"${st} aria-hidden="true">${o.inner}</svg>`}
function dorso(m){return `<div class="cara ${{entorno:"dorso-negro",cultura:"dorso-blanco borde",oraculo:"dorso-gris"}[m]}">${svg("metaxu")}</div>`}
function frenteCampo(m,c){const o=SIMB[c.s];
  return `<div class="cara cara--frente frente frente--${m} ${m==="entorno"?"borde":""}">
    <div class="simb">${svg(c.s,o.w,o.h)}</div><div class="campo">${esc(c.c)}</div><div class="nombre">${esc(c.n)}</div>
    <div class="pauta">${esc(c.p)}</div></div>`}
function frenteOraculo(o){const si=o.c==="Sí";
  return `<div class="cara cara--frente oraculo oraculo--${si?"si":"no"} ${si?"borde":""}">
    <div class="nu">${esc(o.nu)}</div><div class="pal">${o.w.map(esc).join("<br>")}</div>
    <div class="pol">${esc(o.c)}</div></div>`}
let porGirar=null, irA=null;
function carta(m,frente,id,etiqueta){
  return `<div class="mesa"><div class="carta ${porGirar===id?"":"vuelta"}" id="${id}" role="img" aria-label="${esc(etiqueta)}"><div class="carta__giro">${dorso(m)}${frente}</div></div></div>`}
function mazo(m){const nom={entorno:"entorno",cultura:"cultura",oraculo:"oráculo"}[m];
  return `<div class="mesa"><div class="carta" role="img" aria-label="Mazo de ${nom}, boca abajo"><div class="carta__giro">${dorso(m)}</div></div></div>`}
function etqOra(o){return `Carta del oráculo: ${o.nu}: ${o.w.join(", ").toLowerCase()}. ${o.c}`}
function despues(){
  const quieto=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(irA){const el=document.getElementById(irA);irA=null;if(el)el.scrollIntoView({behavior:quieto?"auto":"smooth",block:"nearest"})}
  if(porGirar){const el=document.getElementById(porGirar);porGirar=null;if(el)requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("vuelta")))}}

/* ---------- marco ---------- */
const V=document.getElementById("vista");
function mostrar(html,arriba,ancha){
  V.dataset.vista=mostrar.vista||"";mostrar.vista="";
  document.querySelector(".barra").hidden=["entrada","celular","menu"].includes(V.dataset.vista);
  document.getElementById("pie").hidden=["entrada","celular"].includes(V.dataset.vista);
  document.getElementById("musica").hidden=V.dataset.vista==="celular";
  V.classList.toggle("ancha",!!ancha);
  V.innerHTML=html;
  document.querySelectorAll("#barra-nav [data-accion]").forEach(b=>b.classList.toggle("activo",b.dataset.accion===V.dataset.vista));
  if(arriba!==false){window.scrollTo(0,0);V.focus({preventScroll:true})}
  autoTam();despues()}
function autoTam(){V.querySelectorAll("textarea").forEach(t=>{t.style.height="auto";t.style.height=t.scrollHeight+"px"})}
function bandaGuardado(){return puedeGuardar?"":`<p class="banda">Este navegador no permite guardar. Para no perder lo escrito, usar «Guardar copia» en el diario.</p>`}

/* ---------- mesa ---------- */
function empezarRetazo(){
  const n=E.retazos.reduce((m,r)=>Math.max(m,r.n),0)+1;
  E.curso={n,fase:0,inicio:new Date().toISOString(),nombre:"",consulta:null,fases:[faseNueva("entorno"),faseNueva("cultura")]};
  verEntorno=false;guardar()}

function corteTexto(s){const o=MAZOS.oraculo[s.ora];
  return `<div class="corte">${s.pregunta?`<p class="corte__preg"><em>${esc(s.pregunta)}</em></p>`:""}
  <p class="corte__resp"><span class="gris">Respuesta:</span> <em>${esc(o.nu)}</em>: ${o.w.map(w=>esc(w.toLowerCase())).join(", ")}. ${o.c==="Sí"?"SÍ":"NO"}.</p></div>`}
function colCartas(C){
  const f=C.fase,F=C.fases[f],ent=f===0;
  let h=`<div class="col-cartas"><p class="num centro">${esc(nombreRetazo(C.n).toUpperCase())}</p><h2 class="centro" style="margin:0 0 .4em">${ent?"Fase de entorno":"Fase de cultura"}</h2><div class="cartas2"><div class="ranura">`;
  if(F.carta==null)h+=mazo(F.tipo)+`<div class="acciones" style="margin-top:.6em"><button class="btn" data-accion="sacar">Sacar una carta</button></div>`;
  else{const c=MAZOS[F.tipo][F.carta];h+=carta(F.tipo,frenteCampo(F.tipo,c),"carta-fase",`Carta de ${campoMin(c.c)}: ${c.n}. ${c.p}`)}
  h+=`</div><div class="ranura">`;
  const cons=F.seg.map((s,i)=>s.t==="con"?i:-1).filter(i=>i>=0), ult=cons.length?cons[cons.length-1]:-1;
  if(C.consulta&&C.consulta.abierta){
    h+=mazo("oraculo")+`<div class="consulta"><label for="preg-oraculo">Si querés, escribí una pregunta</label>
    <textarea rows="1" id="preg-oraculo" data-campo="pregunta-consulta">${esc(C.consulta.pregunta||"")}</textarea>
    <div class="acciones" style="margin-top:.6em"><button class="btn" data-accion="sacar-oraculo">Sacar la carta</button></div>
    <div class="acciones" style="margin-top:.2em"><button class="enlace chico" data-accion="cancelar-consulta">Cancelar</button></div></div>`;
  }else{
    if(ult>=0){const s=F.seg[ult],o=MAZOS.oraculo[s.ora];
      h+=carta("oraculo",frenteOraculo(o),"ora-ult",etqOra(o));
      if(s.pregunta)h+=`<p class="pregunta-ult"><em>${esc(s.pregunta)}</em></p>`}
    else h+=mazo("oraculo");
    if(F.carta!=null)h+=`<div class="acciones" style="margin-top:.6em"><button class="btn btn--sec" data-accion="consultar">Consultar el oráculo</button></div>`}
  h+=`</div></div>`;
  return h+`</div>`}
function colTexto(C){
  const f=C.fase,F=C.fases[f];
  let h=`<div class="col-texto">`;
  if(f===1){
    h+=`<div class="acciones" style="margin:0 0 .4em"><button class="enlace chico" data-accion="ver-entorno">${verEntorno?"Ocultar el entorno":"Ver el entorno"}</button></div>`;
    if(verEntorno){const Fe=C.fases[0];
      h+=`<section class="previo">`;
      Fe.seg.forEach((q,i)=>{h+= q.t==="txt"
        ? `<textarea class="desc" id="de-0-${i}" data-f="0" data-s="${i}" data-campo="desc">${esc(q.v)}</textarea>`
        : corteTexto(q)});
      h+=`</section><hr class="separador">`}}
  h+=`<h3 ${f===0?'style="margin-top:0"':""}>Descripción</h3>`;
  F.seg.forEach((s,i)=>{h+= s.t==="txt"
    ? `<textarea class="desc" id="de-${f}-${i}" data-f="${f}" data-s="${i}" data-campo="desc" ${F.carta==null?"disabled":""}>${esc(s.v)}</textarea>`
    : corteTexto(s)});
  h+=`<div class="acciones">${f===0
    ?`<button class="btn" data-accion="fin-entorno" ${F.carta==null?"disabled":""}>Terminar el entorno</button>`
    :`<button class="btn" data-accion="fin-retazo" ${F.carta==null?"disabled":""}>Terminar el retazo</button>`}</div>`;
  return h+`</div>`}
function vMesa(arriba){const C=E.curso;if(!C){vEntrada();return}
  mostrar.vista="mesa";
  mostrar(`<div class="layout">${colCartas(C)}${colTexto(C)}</div>`,arriba,true)}
let foco=null, verEntorno=false;
function insertarConsulta(ora,pregunta){
  const C=E.curso,F=C.fases[C.fase];
  let s=F.seg.length-1;
  while(s>0&&F.seg[s].t!=="txt")s--;
  let pos=F.seg[s].v.length;
  if(foco&&foco.f===C.fase&&F.seg[foco.s]&&F.seg[foco.s].t==="txt"){s=foco.s;pos=Math.min(foco.pos==null?F.seg[s].v.length:foco.pos,F.seg[s].v.length)}
  const antes=F.seg[s].v.slice(0,pos).replace(/\s+$/,""), resto=F.seg[s].v.slice(pos).replace(/^\s+/,"");
  const nuevo={t:"con",ora,pregunta};
  const partes=[];if(antes)partes.push(segTxt(antes));partes.push(nuevo);partes.push(segTxt(resto));
  F.seg.splice(s,1,...partes);
  return F.seg.indexOf(nuevo)}

/* ---------- diario ---------- */
function edDiv(campo,datos,v,clase){
  return `<div class="ed ${clase||""}" contenteditable="plaintext-only" data-campo="${campo}" ${datos}>${esc(v||"")}</div>`}
function vDiario(abrir){
  mostrar.vista="diario";const rs=E.retazos;
  let hojas=`<div class="hoja-bloque"><h1 class="libro-titulo centro">Diario</h1>`;
  hojas+= rs.length?`<ul class="indice-libro">`+rs.map((r,i)=>`<li><button data-accion="ver-retazo" data-r="${i}">
      <span class="it">${esc(titulo(r))}<span class="sub">${esc(nombreRetazo(r.n).toLowerCase())} · ${esc(fecha(r.inicio))}</span></span>
      <span class="puntos"></span><span class="pnum" id="pn-${i}"></span></button></li>`).join("")+`</ul>`
    :`<p class="centro gris">Todavía no hay retazos. Cada retazo se guarda al terminarlo.</p>`;
  hojas+=`</div>`;
  rs.forEach((r,i)=>{
    hojas+=`<div data-ret="${i}" class="hoja-bloque hoja-bloque--salto ret-cab"><p class="num centro" style="margin-bottom:0">${esc(nombreRetazo(r.n).toUpperCase())} · ${esc(fecha(r.inicio))}</p>
    <h2 class="centro" style="margin:.15em 0 .4em">${esc(titulo(r))}</h2>
    <p class="centro rotulo-ed"><span class="gris chico">Nombre</span><br>${edDiv("nombre-diario",`data-r="${i}"`,r.nombre,"ed--nombre")}</p></div>`;
    r.fases.forEach((F,f)=>{if(F.carta==null)return;const c=MAZOS[F.tipo][F.carta];
      hojas+=`<div class="hoja-bloque"><h3>${f===0?"Entorno":"Cultura"}</h3>
      <p class="corte__resp" style="margin:.1em 0 .7em"><span class="gris">Carta:</span> ${esc(c.n)} <span class="gris">(${esc(campoMin(c.c))})</span></p></div>`;
      F.seg.forEach((q,k)=>{hojas+= q.t==="txt"
        ? edDiv("desc-diario",`data-r="${i}" data-f="${f}" data-s="${k}"`,q.v,"ed--desc")
        : corteTexto(q)})});
    if(i===rs.length-1&&!E.curso)hojas+=`<div class="hoja-bloque centro" style="margin-top:1.6em"><hr class="separador">
      <p>Cada sesión vuelve al mismo lugar y le suma un <em>retazo</em>.</p>
      <div class="acciones"><button class="btn" data-accion="nuevo">Siguiente retazo</button></div>
      <p class="chico"><a href="${CUESTIONARIO}" target="_blank" rel="noopener">Contar cómo fue la experiencia</a> <span class="gris">(cuestionario anónimo, se abre aparte)</span></p></div>`});
  const lateral=`<nav class="indice2 indice2--diario" aria-label="Datos del diario">
    <button class="enlace chico" data-accion="guardar-copia">Guardar copia</button>
    <button class="enlace chico" data-accion="cargar-copia">Cargar copia</button>
    ${rs.length?`<button class="enlace chico" data-accion="word">Descargar en Word</button>
    <button class="enlace chico" data-accion="exportar">Descargar como texto</button>`:""}
    <button class="enlace chico" data-accion="reiniciar">Empezar de nuevo</button>
    ${puedeGuardar?"":`<p class="lat-nota">Este navegador no guarda: usá «Guardar copia».</p>`}
    <p id="msj-copia" class="lat-nota" hidden></p></nav>`;
  mostrar(armarLibro(hojas,lateral),true,true);
  montarLibro();
  if(typeof abrir==="number"&&LIB.retCols&&LIB.retCols[abrir]!=null)irCol(LIB.retCols[abrir]);
}

/* ---------- instructivo completo (generado desde el Word con las herramientas) ---------- */
let insInicial=false;
function hojaFig(figs){return `<div class="hoja hoja--centrada">${figs}</div>`}
function paginasInstructivo(){
  return [
   {titulo:"Introducción y despliegue",iz:`<div class="hoja" data-sec="0"><h2 class="hoja-tit">Introducción</h2>
     <p>Metaxu: <em>kósmos</em> es un juego de escritura donde se imagina un mundo y se lo pone en palabras. Ese mundo no existe de antemano; va apareciendo a medida que se lo describe.</p>
     <p>El mundo se construye de a partes. Cada parte es un «retazo», lo que se alcanza a imaginar y a escribir en una sesión de juego. Al volver a jugar, se vuelve al mismo mundo y se le suma un retazo nuevo; con cada vuelta, el mundo crece.</p>
     <p>Ayuda jugar a solas, en un lugar tranquilo. La luz tenue, la música o algún sonido de fondo pueden acompañar.</p>
     <p>No hay nada que preparar; las cartas, la hoja donde se escribe y el diario donde queda todo lo escrito ya están sobre la mesa.</p></div>`,
    de:`<div class="hoja"><h2 class="hoja-tit">El despliegue</h2>
     <p>Sobre la mesa se despliegan tres mazos que guían el proceso creativo. El de entorno y el de cultura traen pautas que indican sobre qué imaginar. El mazo de oráculo ofrece respuestas a las consultas que surgen mientras se escribe.</p>
     <img class="figura fig-media" style="margin-top:14px" alt="Los tres mazos vistos por el dorso: entorno, cultura y oráculo." src="data:image/png;base64,${FIG.dorsos}">
     </div>`},
   {titulo:"Fases y pautas",iz:`<div class="hoja" data-sec="1"><h2 class="hoja-tit">Fases</h2>
     <p>Cada retazo se escribe en dos fases, siempre en el mismo orden. Primero la fase de entorno, después la fase de cultura. Cada fase arranca sacando una carta de su mazo y lleva una sola descripción, un texto corrido.</p>
     <p class="punteo"><span class="rotulo-par">Campos:</span> las cartas de cada mazo se ordenan en cuatro campos. La pauta se lee teniendo en cuenta a qué campo apunta.</p>
     <p class="punteo"><span class="rotulo-par">Fase de entorno:</span> se describe algo del lugar. Sus campos son el paisaje, lo animado, lo que crece y los otros.</p>
     <p class="punteo"><span class="rotulo-par">Fase de cultura:</span> se describe cómo lo imaginado en el entorno toma forma en la cultura de los que viven allí. Sus campos son lo material, lo simbólico, el hacer y lo normado.</p></div>`,
    de:`<div class="hoja"><h2 class="hoja-tit">Pautas</h2>
     <p>Las pautas que traen las cartas tienen una función evocativa. Se leen mediante asociación libre, dejando que lleguen las imágenes, sensaciones o ideas que surjan, sin elegirlas, dentro de lo que la pauta marca.</p>
     <p>Lo escrito no es definitivo; se puede pulir, volver atrás o retocar. No hay límite de extensión.</p></div>`},
   {titulo:"El oráculo",iz:`<div class="hoja" data-sec="2"><h2 class="hoja-tit">Oráculo</h2>
     <p>Mientras se escribe, es posible que el proceso parezca trabarse, pueden surgir dudas o simplemente tener ganas de recibir un apoyo creativo en relación a algo. En esos momentos se puede consultar al oráculo. Consultarlo es sacar una carta de su mazo, pudiendo formular una pregunta o buscando inspiración en su respuesta.</p>
     <p class="punteo"><span class="rotulo-par">Pregunta cerrada:</span> se responde por sí o por no.</p>
     <p class="punteo"><span class="rotulo-par">Pregunta abierta:</span> pregunta por cualquier cosa, menos nombres, números, fechas o elecciones entre dos opciones.</p>
     <p>El oráculo puede consultarse en cualquier momento, las veces que se quiera, incluso antes de empezar a escribir sobre la pauta. También puede no usarse.</p></div>`,
    de:`<div class="hoja"><h2 class="hoja-tit">Núcleo de sentido</h2>
     <p>Las cartas del oráculo muestran un «núcleo de sentido», una frase y unas palabras que sugieren una idea general. Estas respuestas se leen igual que las pautas de los otros mazos, por asociación libre, pensando en lo que llevó a consultar. La conexión puede parecer rara; eso no importa, porque vuelve la descripción más creativa.</p>
     <p>Si la pregunta fue cerrada, el SÍ o el NO del pie responde sin matices. La carta queda a la vista hasta la consulta siguiente.</p>

let LIB=null;
function armarLibro(contenido,indice){
  return `<div class="libro2 ${indice?"con-indice":""}">${indice||""}
  <div class="tomo"><div class="visor" id="visor">
    <div class="hojas" id="hojas">${contenido}</div>

    <button class="flecha flecha--iz" data-accion="hoja-prev" aria-label="Página anterior"><span class="flecha__g">‹</span></button>
    <button class="flecha flecha--de" data-accion="hoja-next" aria-label="Página siguiente"><span class="flecha__g">›</span></button>
    <div class="velo" id="velo" hidden><div class="velo__cara velo__frente"></div><div class="velo__cara velo__dorso"></div></div>
  </div></div></div>`}
function montarLibro(){
  const visor=document.getElementById("visor");if(!visor)return;
  const hojas=document.getElementById("hojas");
  const G=34,W=Math.max(220,Math.floor((visor.clientWidth-G)/2));
  const HH=Math.max(430,Math.min(640,innerHeight-285));
  visor.style.setProperty("--hw",W+"px");visor.style.setProperty("--hg",G+"px");visor.style.setProperty("--hh",HH+"px");
  hojas.style.height=(HH+84)+"px";hojas.style.columnWidth=W+"px";hojas.style.columnGap=G+"px";
  LIB={visor,hojas,W,G,paso:W+G,spread:0,girando:false,retCols:null,secCols:null};
  hojas.style.transform="none";
  const r0=hojas.getBoundingClientRect();
  LIB.cols=Math.max(1,Math.round(hojas.scrollWidth/LIB.paso));
  LIB.total=Math.max(1,Math.ceil(LIB.cols/2));
  const col=el=>Math.max(0,Math.round((el.getBoundingClientRect().left-r0.left)/LIB.paso));
  const rets=hojas.querySelectorAll("[data-ret]");
  if(rets.length){LIB.retCols={};rets.forEach(el=>{const c=col(el);LIB.retCols[+el.dataset.ret]=c;
    const pn=document.getElementById("pn-"+el.dataset.ret);if(pn)pn.textContent=c+1})}
  const secs=hojas.querySelectorAll("[data-sec]");
  if(secs.length){LIB.secCols={};secs.forEach(el=>{LIB.secCols[+el.dataset.sec]=col(el)});
    document.querySelectorAll('.indice2 [data-accion="ir-sec"]').forEach(b=>{b.dataset.c=LIB.secCols[+b.dataset.i]})}
  aplicarLibro()}
function aplicarLibro(){
  const L=LIB;if(!L)return;
  L.hojas.style.transform=`translateX(${-L.spread*2*L.paso}px)`;
  const iz=L.spread*2+1,de=L.spread*2+2;
  document.getElementById("folio-iz").textContent=iz<=L.cols?iz:"";
  document.getElementById("folio-de").textContent=de<=L.cols?de:"";
  L.visor.querySelector(".flecha--iz").style.visibility=L.spread>0?"visible":"hidden";
  L.visor.querySelector(".flecha--de").style.visibility=L.spread<L.total-1?"visible":"hidden";
  if(L.secCols){let act=0;for(const k in L.secCols)if(L.secCols[k]<=L.spread*2+1)act=Math.max(act,+k);
    document.querySelectorAll('.indice2 [data-accion="ir-sec"]').forEach(b=>b.classList.toggle("actual",+b.dataset.i===act))}
}
function irCol(c){if(!LIB)return;LIB.spread=Math.max(0,Math.min(LIB.total-1,Math.floor(c/2)));aplicarLibro()}
function pasarLibro(d){
  const L=LIB;if(!L||L.girando)return;
  const s2=L.spread+d;if(s2<0||s2>=L.total)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){L.spread=s2;aplicarLibro();return}
  L.girando=true;const v=document.getElementById("velo"),der=d>0;
  v.style.left=der?`calc(var(--hw) + var(--hg))`:"0px";
  v.style.transformOrigin=der?"left center":"right center";
  v.hidden=false;v.style.transition="none";v.style.transform="rotateY(0deg)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    v.style.transition="transform .55s cubic-bezier(.33,.55,.3,1)";
    v.style.transform=`rotateY(${der?-180:180}deg)`;
    setTimeout(()=>{L.spread=s2;aplicarLibro()},275);
    setTimeout(()=>{v.hidden=true;L.girando=false},580)}))}

/* ---------- texto exportado ---------- */
function respTexto(o){return `${o.c==="Sí"?"SÍ":"NO"} · ${o.nu}: ${o.w.join(", ").toLowerCase()}`}
function textoRetazo(r){
  let t=`${titulo(r).toUpperCase()} (${fecha(r.inicio)})\n`;
  r.fases.forEach((F,f)=>{if(F.carta==null)return;const c=MAZOS[F.tipo][F.carta];
    t+=`\n${f===0?"Entorno":"Cultura"}\nCarta: ${c.n} (${campoMin(c.c)}). ${c.p}\n\n`;
    F.seg.forEach(s=>{
      if(s.t==="con")t+=`[${s.pregunta?`Pregunta: ${s.pregunta} · `:""}Oráculo: ${respTexto(MAZOS.oraculo[s.ora])}]\n`;
      else if(s.v.trim())t+=`${s.v}\n`})});
  return t}

/* ---------- diario en Word (.docx), armado en el navegador ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(archivos){ // método «store», sin compresión
  const enc=new TextEncoder(),partes=[],central=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const [nombre,texto] of archivos){
    const n=enc.encode(nombre),d=enc.encode(texto),c=crc32(d);
    const cab=[...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0)];
    partes.push(new Uint8Array(cab),n,d);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)],n);
    off+=cab.length+n.length+d.length}
  let tam=0;const cen=[];for(let i=0;i<central.length;i+=2){const a=new Uint8Array(central[i]);cen.push(a,central[i+1]);tam+=a.length+central[i+1].length}
  const fin=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(archivos.length),...u16(archivos.length),...u32(tam),...u32(off),...u16(0)]);
  return new Blob([...partes,...cen,fin],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})}
function x(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function wr(t,o={}){return `<w:r><w:rPr>${o.b?"<w:b/>":""}${o.i?"<w:i/>":""}${o.c?`<w:color w:val="${o.c}"/>`:""}${o.sz?`<w:sz w:val="${o.sz}"/>`:""}</w:rPr><w:t xml:space="preserve">${x(t)}</w:t></w:r>`}
function wp(runs,o={}){return `<w:p><w:pPr>${o.c?'<w:jc w:val="center"/>':""}<w:spacing w:before="${o.antes||0}" w:after="${o.despues??120}"/>${o.keep?"<w:keepNext/>":""}</w:pPr>${runs}</w:p>`}
function docxDiario(){
  let b=wp(wr("Diario de Metaxu",{sz:40}),{c:1,despues:360});
  E.retazos.forEach(r=>{
    b+=wp(wr(titulo(r),{b:1,sz:30}),{c:1,antes:360,despues:40,keep:1})+wp(wr(fecha(r.inicio),{c:"6B6B6B",sz:18}),{c:1,despues:240});
    r.fases.forEach((F,f)=>{if(F.carta==null)return;const c=MAZOS[F.tipo][F.carta];
      b+=wp(wr(f===0?"Entorno":"Cultura",{b:1,sz:24}),{c:1,antes:240,despues:120,keep:1});
      b+=wp(wr("Carta: ",{i:1,c:"6B6B6B"})+wr(`${c.n} (${campoMin(c.c)})`))+wp(wr(c.p,{i:1,c:"6B6B6B",sz:20}),{despues:200});
      F.seg.forEach(q=>{
        if(q.t==="con"){const o=MAZOS.oraculo[q.ora];
          if(q.pregunta)b+=wp(wr("Pregunta: ",{i:1,c:"6B6B6B"})+wr(q.pregunta,{i:1}),{antes:120,despues:40});
          b+=wp(wr("Oráculo: ",{c:"6B6B6B"})+wr(respTexto(o)),{antes:q.pregunta?0:120,despues:120});
        } else (q.v||"").split("\n").forEach(l=>{b+=wp(wr(l),{despues:80})})})})});
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1418" w:bottom="1418" w:left="1418" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const estilos=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Inter" w:hAnsi="Inter" w:cs="Inter"/><w:sz w:val="22"/><w:lang w:val="es-AR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:line="300" w:lineRule="auto"/><w:jc w:val="both"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`;
  return zip([
    ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`],
    ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`],
    ["word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["word/document.xml",doc],["word/styles.xml",estilos]])}

window.addEventListener("pagehide",guardarYa);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")guardarYa()});
document.addEventListener("focusout",ev=>{if(ev.target.dataset&&ev.target.dataset.campo)guardarYa()});
(esCelular()?vCelular:vEntrada)();
/* ---------- control de la música ---------- */
(function(){
  const K="metaxu.musica", ON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/></svg>', OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  let pref={on:true,vol:.5};
  try{const g=JSON.parse(localStorage.getItem(K));if(g&&typeof g==="object")pref={on:g.on!==false,vol:typeof g.vol==="number"?g.vol:.5}}catch(e){}
  const caja=document.getElementById("musica"),boton=document.getElementById("musica-boton"),barra=document.getElementById("musica-vol");
  let ctx=null,m=null,tSusp=null;
  const guardarPref=()=>{try{localStorage.setItem(K,JSON.stringify(pref))}catch(e){}};
  const esCelular=()=>document.getElementById("vista").dataset.vista==="celular";
  function pintar(){
    boton.innerHTML=pref.on?ON:OFF;
    boton.setAttribute("aria-label",pref.on?"Apagar la música":"Prender la música");
    boton.setAttribute("aria-pressed",String(pref.on));
    barra.value=Math.round(pref.vol*100);caja.classList.toggle("apagada",!pref.on)}
  function arrancar(){
    if(!pref.on||esCelular())return;
    try{
      if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        try{ctx=new AC({latencyHint:"playback"})}catch(e){ctx=new AC()}m=MetaxuMusica.crear(ctx,ctx.destination,{volumen:pref.vol})}
      clearTimeout(tSusp);
      const ir=()=>m.iniciar();
      if(ctx.state!=="running")ctx.resume().then(ir,()=>{});else ir();
    }catch(e){}}
  function parar(){if(!m)return;m.detener();clearTimeout(tSusp);tSusp=setTimeout(()=>{try{ctx.suspend()}catch(e){}},1000)}
  function gesto(ev){
    if(caja.contains(ev.target))return;
    arrancar();
    if(!pref.on||(ctx&&ctx.state==="running")){document.removeEventListener("pointerdown",gesto,true);document.removeEventListener("keydown",gesto,true)}}
  document.addEventListener("pointerdown",gesto,true);
  document.addEventListener("keydown",gesto,true);
  boton.addEventListener("click",()=>{pref.on=!pref.on;guardarPref();pintar();if(pref.on)arrancar();else parar()});
  barra.addEventListener("input",()=>{pref.vol=barra.value/100;guardarPref();if(m)m.volumen(pref.vol);
    if(!pref.on&&pref.vol>0){pref.on=true;guardarPref();pintar();arrancar()}});
  window.metaxuMusicaEstado=()=>({pref,ctx:ctx&&ctx.state});
  pintar();
})();
</script>
<script>
/* La instalación solo corre cuando la app se sirve por la web. */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js")});
}
</script>
